name: Validate Android admin app
on:
  push:
    branches: [main]
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android native tests and lint
        working-directory: android-admin
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon --console=plain
