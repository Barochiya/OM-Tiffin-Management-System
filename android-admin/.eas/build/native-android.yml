build:
  name: OM Tiffin native Android APK
  steps:
    - eas/checkout
    - run:
        name: Build and validate Android application
        command: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest lintRelease --no-daemon --console=plain
    - eas/upload_artifact:
        name: Upload installable APK
        inputs:
          type: application-archive
          path: app/build/outputs/apk/release/app-release.apk
