plugins { id 'com.android.application' }
android {
 namespace 'com.omtiffin.admin'
 compileSdk 35
 defaultConfig { applicationId 'com.omtiffin.admin'; minSdk 26; targetSdk 35; versionCode 9; versionName '0.6.0'; testInstrumentationRunner (project.findProperty('sessionRunner') ?: 'com.omtiffin.admin.ScreenshotInstrumentation') }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { androidTest.assets.srcDirs += ['../../frontend/dist'] }
 buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.13.0'; implementation 'androidx.biometric:biometric:1.1.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
